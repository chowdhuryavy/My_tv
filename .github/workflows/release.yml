name: Build TV APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, for the "What's new" notes

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: launcher
        env:
          # Official signing key (repo secret). Copies of the repo don't have it, so their
          # builds are signed with a throwaway key and the app shows "unofficial build".
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -e
          # Newest stable build-tools and platform (skip beta / rc / ext)
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | grep -viE 'rc|beta|preview' | sort -V | tail -1)
          PLAT=$(ls $ANDROID_HOME/platforms | grep -E '^android-[0-9]+$' | sort -V | tail -1)
          if [ -z "$PLAT" ]; then
            PLAT=$(ls $ANDROID_HOME/platforms | grep -viE 'beta|preview|ext' | sort -V | tail -1)
          fi
          JAR=$ANDROID_HOME/platforms/$PLAT/android.jar
          echo "Build-tools: $BT"
          echo "Platform:    $JAR"

          rm -rf out && mkdir -p out/gen out/classes out/dex

          # Version: major.minor from AndroidManifest.xml + this build's number, e.g. 3.7.12
          BASE=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2 | cut -d. -f1,2)
          VERSION="$BASE.${{ github.run_number }}"
          CODE=$((1000 + ${{ github.run_number }}))
          echo "Version: v$VERSION (code $CODE)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # 1. Resources
          $BT/aapt2 compile --dir res -o out/res.zip
          $BT/aapt2 link -I $JAR --manifest AndroidManifest.xml \
            --min-sdk-version 25 --target-sdk-version 25 \
            --version-name "$VERSION" --version-code "$CODE" --replace-version \
            --java out/gen -o out/base.apk out/res.zip

          # 2. Java -> classes
          javac --release 11 -encoding UTF-8 -XDstringConcat=inline -nowarn \
            -classpath $JAR -d out/classes \
            $(find src out/gen -name "*.java")

          # 3. Classes -> dex
          $BT/d8 --release --min-api 25 --lib $JAR --output out/dex \
            $(find out/classes -name "*.class")

          # 4. Package, align, sign
          cp out/base.apk out/unsigned.apk
          zip -j out/unsigned.apk out/dex/classes.dex
          $BT/zipalign -f -p 4 out/unsigned.apk out/aligned.apk
          if [ -n "$SIGNING_KEYSTORE" ]; then
            # tolerate spaces / line breaks picked up when the secret was pasted
            KS=$(printf '%s' "$SIGNING_KEYSTORE" | tr -d ' \r\n\t')
            echo "Signing key length: ${#KS} characters (expected 4548)"
            if ! printf '%s' "$KS" | base64 -d > out/key.jks 2>/dev/null; then
              echo "::error::The SIGNING_KEYSTORE secret isn't valid. Paste the whole SIGNING_KEYSTORE.txt contents again."
              exit 1
            fi
            FP=$(keytool -list -v -keystore out/key.jks -storepass android -alias avy 2>/dev/null | grep -m1 'SHA256:' | tr -d ' :\t' | sed 's/SHA256//')
            if [ "$FP" != "2DFBA87097DEFA6F46EA5673CEB70079B1CF2374F43110AD96B1C217FFA7AF6E" ]; then
              echo "::error::SIGNING_KEYSTORE doesn't contain Avy's key (fingerprint $FP)."
              exit 1
            fi
            ALIAS=avy
            echo "Signing: official Avy key"
          else
            keytool -genkeypair -storetype PKCS12 -keystore out/key.jks \
              -storepass android -keypass android -alias key \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Unofficial build"
            ALIAS=key
            echo "Signing: temporary key (unofficial build)"
          fi
          $BT/apksigner sign --ks out/key.jks --ks-key-alias $ALIAS --ks-pass pass:android \
            --key-pass pass:android --out ../TvHome.apk out/aligned.apk
          rm -f out/key.jks
          $BT/apksigner verify ../TvHome.apk
          mv ../TvHome.apk "../AvyTVHome-v$VERSION.apk"
          echo "APK v$VERSION built successfully"

      - name: Release notes (What's new = commit titles since the previous release)
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
          {
            echo "## What's new"
            if [ -n "$PREV" ]; then git log "$PREV..HEAD" --no-merges --pretty='- %s' | head -8
            else git log -1 --pretty='- %s'; fi
            echo
            echo "Avy TV Home **v$VERSION**, built from ${{ github.sha }}."
            echo "Newest version is always at: https://github.com/${{ github.repository }}/releases/latest"
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Avy TV Home v${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: AvyTVHome-v${{ env.VERSION }}.apk
