name: Release APK
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: |
          F=$(find . -name "settings.gradle*" | head -1)
          if [ -z "$F" ]; then
            echo "NO ANDROID PROJECT FOUND. Repo files:"
            find . -not -path "./.git/*" | head -100
            exit 1
          fi
          cd "$(dirname "$F")"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug
          else gradle assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: '**/build/outputs/apk/debug/*.apk' }
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: '**/build/outputs/apk/debug/*.apk'
