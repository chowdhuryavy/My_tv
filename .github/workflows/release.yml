name: Release APK
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        working-directory: launcher
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          JAR=$ANDROID_HOME/platforms/$(ls $ANDROID_HOME/platforms | sort -V | tail -1)/android.jar
          mkdir -p out/gen out/classes out/dex
          $BT/aapt2 compile --dir res -o out/res.zip
          $BT/aapt2 link -I $JAR --manifest AndroidManifest.xml \
            --min-sdk-version 21 --target-sdk-version 34 \
            --java out/gen -o out/base.apk out/res.zip
          javac -source 1.8 -target 1.8 -bootclasspath $JAR -nowarn \
            -d out/classes $(find src out/gen -name "*.java")
          $BT/d8 --min-api 21 --lib $JAR --output out/dex $(find out/classes -name "*.class")
          cp out/base.apk out/unsigned.apk
          zip -j out/unsigned.apk out/dex/classes.dex
          $BT/zipalign -f 4 out/unsigned.apk out/aligned.apk
          keytool -genkeypair -keystore out/key.jks -storepass android -keypass android \
            -alias key -keyalg RSA -validity 10000 -dname "CN=Avy"
          $BT/apksigner sign --ks out/key.jks --ks-pass pass:android \
            --out ../TvHome.apk out/aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: TvHome.apk }
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with: { files: TvHome.apk }
